[project]
name = "rxtriage-slm-demo"
version = "0.1.0"
description = "Fine-tuned SLM for pharma supply chain transaction normalization and exception triage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "lxml>=5.2",
    "faker>=25.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "transformers>=4.44",  # tokenizer-only for now (token-length audit); training uses it in Phase 3
    "jinja2>=3.1",  # required by transformers' apply_chat_template
    "openai>=1.40",  # one client for both Ollama (base_url override) and gpt-4o-mini baselines
    "python-dotenv>=1.0",  # load OPENAI_API_KEY from .env at eval time
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]
# Phase 3.2 QLoRA training stack. NOTE: install these with `uv pip install` (or
# manually), NOT `uv sync --group train` / `uv run --group train` — the resolver
# replaces the manually-installed CUDA torch wheel with a CPU-only build, which
# silently disables the GPU. torch itself is installed separately from the
# pytorch CUDA index:
#   uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu130
# transformers pinned to trl-compatible 4.x (avoids the 5.x API drift).
# Versions below reflect what was validated on this box (RTX 4090 Laptop, cu130).
train = [
    "torch>=2.9",
    "transformers>=4.55,<5",
    "peft>=0.15",
    "trl>=0.20",
    "bitsandbytes>=0.45",
    "datasets>=2.20",
    "accelerate>=1.0",
    "pyyaml>=6.0",
]
# Unsloth path (training/train_unsloth.py) — patched FastLanguageModel gives
# faster/lower-VRAM QLoRA than the plain train group above. Same "install
# manually, don't uv sync" caveat applies. Needs triton-windows on native
# Windows (no official Triton wheel there):
#   uv pip install unsloth --torch-backend=auto
unsloth = [
    "unsloth",
    "triton-windows ; platform_system == 'Windows'",
]
# Phase 3.4 AWQ quantization (training/quantize_awq.py). llmcompressor's resolver
# wants a DIFFERENT torch/transformers pin than the `train` group above (and would
# downgrade the training venv's CUDA torch if installed there) — so this group is
# installed into a SEPARATE venv (`.venv-quant`), never `uv sync`'d into the main
# one. Setup:
#   uv venv .venv-quant
#   uv pip install --python .venv-quant torch --index-url https://download.pytorch.org/whl/cu130
#   uv pip install --python .venv-quant llmcompressor transformers datasets accelerate
#   # llmcompressor's install silently downgrades torch to a CPU wheel; reinstall CUDA after:
#   uv pip install --python .venv-quant torch==2.13.0+cu130 --index-url https://download.pytorch.org/whl/cu130 --reinstall-package torch
quant = [
    "llmcompressor",
    "transformers",
    "datasets",
    "accelerate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["schema.py", "rules", "datagen", "training", "serving", "eval", "agent"]
